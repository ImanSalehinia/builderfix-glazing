<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Background -->
  <rect width="48" height="48" rx="9" fill="#0f2442"/>

  <!-- B (white) -->
  <rect x="7"    y="7"    width="4.5"  height="33"  fill="white"/>
  <rect x="7"    y="7"    width="14.5" height="4.5" fill="white"/>
  <rect x="7"    y="21"   width="12.5" height="4"   fill="white"/>
  <rect x="7"    y="35.5" width="14.5" height="4.5" fill="white"/>
  <rect x="17.5" y="7"    width="4"    height="18"  fill="white"/>
  <rect x="17.5" y="25"   width="4"    height="15"  fill="white"/>

  <!-- F as glass cutter (orange) -->
  <!-- Top grip = F top bar -->
  <rect x="24.5" y="7"    width="16.5" height="5.5" rx="2.75" fill="#f97316"/>
  <!-- Shaft = F vertical -->
  <rect x="28.5" y="12.5" width="4.5"  height="20"            fill="#f97316"/>
  <!-- Wheel housing = F mid bar -->
  <rect x="28.5" y="21.5" width="11.5" height="5"   rx="2"    fill="#f97316"/>
  <!-- Scoring head -->
  <rect x="26.5" y="32"   width="8.5"  height="7"   rx="3"    fill="#f97316"/>
  <!-- Scoring tip (triangle) -->
  <path d="M29.5,39 L35,39 L32.25,43 Z"                       fill="#f97316"/>
  <!-- Carbide wheel detail -->
  <circle cx="30.75" cy="35.5" r="1.75" fill="rgba(255,255,255,0.28)"/>

  <!-- Baseline bar -->
  <rect x="7" y="44.5" width="34" height="2.5" rx="1.25"      fill="#f97316"/>
</svg>
